name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # The package, packages/core.
      - run: bun run typecheck
        working-directory: packages/core
      - run: bun test
        working-directory: packages/core
      # Fails if the public API differs from api/*.api.md (the contract).
      - run: bun run build
        working-directory: packages/core
      - run: bun run check:size
        working-directory: packages/core
      - run: bun run lint:package
        working-directory: packages/core
      # PixiJS and a consumer's renderers module stay out of what a page loads up front: from the
      # source, and from the built package as consumers install it.
      - run: bun run check:bundle
        working-directory: packages/core
      - run: bun run check:bundle --built
        working-directory: packages/core
      # The apps, and the docs site's demos (type-checked and tested against the package source).
      - run: bun run check
        working-directory: apps/world
      - run: bun run typecheck
      - run: bun run test

  # The peer ranges package.json declares are tested, not assumed: each cell installs the packed
  # package into a fresh npm project, type-checks a consumer under bundler and node16 resolution,
  # and runs it under Node 20.
  peers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: ["18", "19"]
        pixi: ["8.13.2", "8"]
    name: peers (react ${{ matrix.react }}, pixi.js ${{ matrix.pixi }})
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bun install --frozen-lockfile
      - run: bun run build
        working-directory: packages/core
      - run: bun run check:consumer ${{ matrix.react }} ${{ matrix.pixi }}
        working-directory: packages/core
