name: Docs

# The documentation site (site/): built and link-checked on every pull request, and deployed to
# GitHub Pages from main. Its demos import the package from src/, so the site always documents
# the code in the same commit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile --cwd site
      # Every page shows code only through a demo that runs it.
      - run: bun run scripts/check-docs.ts
      # Builds the examples for the gallery, the API reference, and every page; fails on a broken
      # internal link (starlight-links-validator).
      - run: bun run --cwd site build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
