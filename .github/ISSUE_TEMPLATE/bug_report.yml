name: Bug report
description: Something does not work as the documentation says.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The smallest scene source and props that show it, or a link to a repository.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "@thirkettle/data-explorer, react, pixi.js, and the browser."
    validations:
      required: true
