name: Feature request
description: Something the package should do.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you are trying to do
      description: The data and the experience you want, not only the API you have in mind.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What you do today instead
